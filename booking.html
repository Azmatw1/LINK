<!DOCTYPE html>
<html>
    <head>
        <title>LINK/Book a slot</title>
         <link rel="stylesheet" href="looks.css">
    </head>
    <body>
        <h1>LINK</h1>
        <h2>Book your procurement slot</h2>
        <label> Procurement centre</label>
        <br>
        <input type="text" placeholder="Enter centre">
        <br><br>
        <label>Date</label>
        <br>
        <input type="date">
        <br><br>
        <label>Time</label>
        <br>
        <input type="time">
        <br><br>
        <label>Crop</label>
        <br>
        <input type="text" placeholder="e.g rice">
        <br><br>
        <label>Quantity (Kg)</label>
        <br>
        <input type="number" placeholder="e.g 100">
        <br><br>
        <a href="token.html">
            <button id="bookbtn">Book slot</button>
        </a>
        <script src="script.js"></script>

    </body>
</html>
