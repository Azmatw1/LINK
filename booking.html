<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINK - Book a Slot</title>
    <link rel="stylesheet" href="looks.css">
</head>
<body>

    <main class="auth-card">
        <!-- Top Bar: Tag & Language Switcher -->
        <div class="card-top-bar">
            <span class="badge" data-i18n="badge">🌾 Government Approved Portal</span>
            
            <select id="langSelect" class="lang-dropdown">
                <option value="en">English</option>
                <option value="hi">हिंदी (Hindi)</option>
                <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
            </select>
        </div>

        <!-- Header -->
        <header class="auth-header">
            <h1 class="brand-title">LINK</h1>
            <h2 data-i18n="bookTitle">Book Procurement Slot</h2>
            <p data-i18n="bookSub">Schedule a time to drop off your crops at the nearest center.</p>
        </header>

        <!-- Booking Form -->
        <form id="bookingForm">
            <!-- Center Selection -->
            <div class="form-group">
                <label for="centre" data-i18n="centerLabel">Procurement Centre</label>
                <select id="centre" name="centre" required>
                    <option value="" disabled selected data-i18n="selectCenter">-- Select Nearest Centre --</option>
                    <option value="center_1">Mandi Center A (Main Market)</option>
                    <option value="center_2">Mandi Center B (North Hub)</option>
                    <option value="center_3">Cooperative Grain Hub C</option>
                </select>
            </div>

            <!-- Crop Selection -->
            <div class="form-group">
                <label for="crop" data-i18n="cropLabel">Crop Type</label>
                <select id="crop" name="crop" required>
                    <option value="" disabled selected data-i18n="selectCrop">-- Select Crop --</option>
                    <option value="wheat">Wheat (गेहूँ / ਕਣਕ)</option>
                    <option value="paddy">Paddy / Rice (धान / ਝੋਨਾ)</option>
                    <option value="maize">Maize (मक्का / ਮੱਕੀ)</option>
                </select>
            </div>

            <!-- Quantity -->
            <div class="form-group">
                <label for="quantity" data-i18n="quantityLabel">Quantity (in Quintals)</label>
                <input 
                    type="number" 
                    id="quantity" 
                    name="quantity" 
                    placeholder="e.g. 50" 
                    data-i18n-placeholder="qtyPlaceholder"
                    min="1" 
                    max="500" 
                    required
                >
            </div>

            <!-- Date Selection -->
            <div class="form-group">
                <label for="bookingDate" data-i18n="dateLabel">Preferred Date</label>
                <input type="date" id="bookingDate" name="bookingDate" required>
            </div>

            <!-- Time Slot Selection -->
            <div class="form-group">
                <label for="timeSlot" data-i18n="timeLabel">Time Slot</label>
                <select id="timeSlot" name="timeSlot" required>
                    <option value="" disabled selected data-i18n="selectTime">-- Select Time Window --</option>
                    <option value="09:00-11:00">09:00 AM - 11:00 AM</option>
                    <option value="11:00-13:00">11:00 AM - 01:00 PM</option>
                    <option value="14:00-16:00">02:00 PM - 04:00 PM</option>
                </select>
            </div>

            <button type="submit" id="bookbtn" class="btn-primary" data-i18n="bookBtnText">Confirm Slot Booking</button>
        </form>

        <!-- Navigation Links -->
        <footer class="auth-footer">
            <p><a href="dashboard.html" data-i18n="backDashboard">← Back to Dashboard</a></p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
