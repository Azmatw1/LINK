<!DOCTYPE html>
<html>
    <head>
        <title> LINK-Login </title>
        <link rel="stylesheet" href="looks.css">

    </head>
    <body>
        <h1>LINK</h1>
        <h2>Welcome to LINK</h2>
        <p>Login to manage your procurement slots.</p>
        <form id="loginForm">

            <input
                type="text"
                id="phoneNumber"
                placeholder="Phone number"
                required
            >

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

        <p>Don't have an account?</p>

        <a href="register.html">Register</a>

        <!-- JavaScript -->
        <script src="script.js"></script>

    </body>
</html>
