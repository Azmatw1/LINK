<!DOCTYPE html>
<html>
    <head>
        <title> LINK-Login </title>
        <link rel="stylesheet" href="looks.css">

    </head>
    <body>
        <h1>LINK</h1>
         <!-- Language buttons -->
        <button type="button" id="englishBtn">English</button>
        <button type="button" id="urduBtn">اردو</button>

        <h2 id="welcomeText">Welcome to LINK</h2>
         <p id="descriptionText">
            Login to manage your procurement slots.
        </p>
        <form id="loginForm">

            <input
                type="text"
                id="phoneNumber"
                placeholder="Phone number"
                required
            >

            <br><br>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <br><br>

            <button type="submit" id="loginButton">
                Login
            </button>

        </form>

         <p id="registerQuestion">
            Don't have an account?
        </p>

        <a href="register.html" id="registerLink">Register</a>

        <!-- JavaScript -->
        <script src="script.js"></script>

    </body>
</html>
