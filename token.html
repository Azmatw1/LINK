<!DOCTYPE html>
<html>
    <head>
        <title>LINK/Token</title>
        <link rel="stylesheet" href="looks.css">
    </head>

    <body>
        <h1>LINK</h1>

        <h2>Slot booked successfully!</h2>

        <p>Your procurement token is:</p>

        <h1 id="tokenNumber">Loading...</h1>

        <p>Please arrive at your selected procurement centre on time.</p>

       <a id="trackQueueLink" href="queue.html">
    Track queue
</a>

        <script src="script.js"></script>

        <script>
            const token = localStorage.getItem("tokenNumber");

            if (token) {
                // Show the booking reference in a farmer-friendly format.
// Example: token 4 becomes APL-004.
const formattedToken = "APL-" + String(token).padStart(3, "0");

document.getElementById("tokenNumber").textContent =
    formattedToken;
            }
            const bookingId = localStorage.getItem("bookingId");

if (bookingId) {
    document.getElementById("trackQueueLink").href =
        `queue.html?booking_id=${bookingId}`;
}
        </script>
    </body>
</html>
